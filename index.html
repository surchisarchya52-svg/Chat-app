<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>

  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>

  <div style="max-width: 400px; margin: 20px auto; font-family: sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 10px;">
    <h2>Chat App</h2>
    <p>Enable notifications to receive messages.</p>
    
    <button id="notify-btn" style="padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%;">
      🔔 Enable Push Notifications
    </button>

    <div id="messages" style="height: 200px; border: 1px solid #ddd; margin: 15px 0; padding: 10px; overflow-y: auto;"></div>

    <div style="display: flex; gap: 10px;">
      <input type="text" id="name" placeholder="Name" style="flex: 1; padding: 8px;">
      <button id="send" style="padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px;">Send</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Main JS -->
  <script src="app.js"></script>
</body>
</html>
